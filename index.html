<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizapp</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>

    <!-- Bootstrap files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</head>

<body onload="init()">

    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
    </nav>

    <div class="main_container">
        <div class="card quiz_card">
            <img src="./img/pushup.jpg" id="header-image" class="card-img-top" alt="Push up">

            <div class="progress" role="progressbar">
                <div id="progress-bar-percent" class="progress-bar" style="width: 0%">25%</div>
            </div>

            <div class="card-body" id="end-screen" style="display: none;">
                <div class="text_center finish_quiz_headline">
                    Quiz beendet!
                </div>

                <div class="text_center">
                    Du hast <b id="right-questions">X</b> von <b id="questionsAmountFinish">X</b> Fragen richtig
                    beantwortet!
                </div>

                <div class="button_new_game">
                    <button onclick="restartGame()" class="btn btn-dark">Spiele erneut</button>
                </div>

            </div>

            <div class="card-body" id="question-body">
                <h5 class="card-title" id="questiontext">Frage</h5>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4">
                        Antwort
                    </div>
                </div>

                <div class="question_footer">
                    <span>
                        <b id="current-question-number">1</b> von <b id="questionsAmount"></b> Fragen
                    </span>
                    <button onclick="nextQuestion()" class="btn btn-dark" disabled id="next-button">Nächste
                        Frage</button>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
